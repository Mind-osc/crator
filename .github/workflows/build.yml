name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CRATOR_KEYSTORE_BASE64 != '' }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CRATOR_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/crator.jks"
            echo "CRATOR_KEYSTORE=$RUNNER_TEMP/crator.jks" >> "$GITHUB_ENV"
          elif [ "$IS_MAIN" = "true" ]; then
            echo "::error::Λείπει το secret CRATOR_KEYSTORE_BASE64 — δεν βγαίνει release χωρίς το κλειδί"
            exit 1
          else
            echo "::warning::Χωρίς κλειδί: το APK υπογράφεται με debug key και δεν δημοσιεύεται"
          fi

      - name: Build release APK
        env:
          CRATOR_STORE_PASSWORD: ${{ secrets.CRATOR_STORE_PASSWORD }}
          CRATOR_KEY_ALIAS: crator
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      # τα σφάλματα του Kotlin εμφανίζονται ως annotations (ορατά χωρίς τα logs)
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -40 | sed -E 's#^e: (file://)?#::error::#' || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Crator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Crator-apk
          path: Crator.apk

      - name: Publish release
        if: env.IS_MAIN == 'true' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crator (τελευταία έκδοση)
          body: Κατέβασε το Crator.apk και άνοιξέ το στο κινητό για εγκατάσταση.
          files: Crator.apk
          make_latest: true
